name: Build & Release

# Builds self-contained Xue distributions: a relocatable CPython
# (python-build-standalone) with the `xue` package in its standard library,
# the Xue start-up hook in site.py, and the C-accelerated units / autodiff /
# tensor backends. Two flavours per platform: CPython 3.12 and free-threaded
# CPython 3.14t.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version used in archive names and the release (e.g. v1.1.0)'
        required: true
      publish:
        description: 'Upload to the GitHub Release (false = build artifacts only)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  PBS_RELEASE: '20261026'
  PY312: '3.12.16'
  PY314: '3.14.10'

jobs:
  build:
    name: ${{ matrix.target.platform }} (${{ matrix.flavor }})
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        flavor: ['3.12', '3.14t']
        target:
          - { os: ubuntu-22.04,     platform: linux-x86_64,   triple: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, platform: linux-aarch64,  triple: aarch64-unknown-linux-gnu }
          - { os: macos-latest,     platform: macos-arm64,    triple: aarch64-apple-darwin }
          - { os: macos-15-intel,   platform: macos-x86_64,   triple: x86_64-apple-darwin }
          - { os: windows-latest,   platform: windows-x86_64, triple: x86_64-pc-windows-msvc }

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Fetch CPython
        run: |
          set -euo pipefail
          if [ "${{ matrix.flavor }}" = "3.12" ]; then
            F="cpython-${PY312}+${PBS_RELEASE}-${{ matrix.target.triple }}-install_only_stripped.tar.gz"; SUFFIX=""
          else
            F="cpython-${PY314}+${PBS_RELEASE}-${{ matrix.target.triple }}-freethreaded-install_only_stripped.tar.gz"; SUFFIX="-3.14t"
          fi
          U="https://github.com/astral-sh/python-build-standalone/releases/download/${PBS_RELEASE}"
          mkdir -p "$RUNNER_TEMP/pbs"
          curl -fsSL -o "$RUNNER_TEMP/pbs/$F" "$U/$F"
          curl -fsSL -o "$RUNNER_TEMP/pbs/SHA256SUMS" "$U/SHA256SUMS"
          want=$(grep " $F\$" "$RUNNER_TEMP/pbs/SHA256SUMS" | cut -d' ' -f1)
          if command -v sha256sum >/dev/null; then got=$(sha256sum "$RUNNER_TEMP/pbs/$F" | cut -d' ' -f1)
          else got=$(shasum -a 256 "$RUNNER_TEMP/pbs/$F" | cut -d' ' -f1); fi
          [ -n "$want" ] && [ "$want" = "$got" ] || { echo "checksum mismatch for $F"; exit 1; }
          tar -xzf "$RUNNER_TEMP/pbs/$F"
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          PKG="xue-${VERSION}-${{ matrix.target.platform }}${SUFFIX}"
          mv python "$PKG"
          if [ "$RUNNER_OS" = "Windows" ]; then PYEXE="$PKG/python.exe"; else PYEXE="$PKG/bin/python3"; fi
          "$PYEXE" -VV
          echo "PKG=$PKG" >> "$GITHUB_ENV"
          echo "PYEXE=$PYEXE" >> "$GITHUB_ENV"

      - name: Add the xue package and start-up hook
        run: |
          set -euo pipefail
          "$PYEXE" tools/assemble_dist.py "$PKG" | tee -a "$GITHUB_ENV"

      # ---- C accelerators ----------------------------------------------------
      # Linux: compile in a manylinux_2_28 container so the extensions run on
      # glibc 2.28+ (RHEL 8, Ubuntu 20.04, Debian 10 and newer).
      - name: Build C extensions (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          case "$(uname -m)" in x86_64) SIMD="-mavx2 -mfma" ;; *) SIMD="" ;; esac
          docker run --rm -v "$PWD:/w" -w /w \
            -e PYINC -e PYEXT -e XUEDIR -e SIMD="$SIMD" \
            "quay.io/pypa/manylinux_2_28_$(uname -m)" bash -euc '
              for s in _units_accel _autodiff_accel _tensor_accel; do
                gcc -shared -O3 $SIMD -fPIC -I"$PYINC" "xue-native/$s.c" -o "$XUEDIR/$s$PYEXT" -lm -ldl
                echo "built $s$PYEXT"
              done'
          sudo chown -R "$(id -u):$(id -g)" "$XUEDIR"

      - name: Build C extensions (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          case "$(uname -m)" in x86_64) SIMD="-mavx2 -mfma" ;; *) SIMD="" ;; esac
          for s in _units_accel _autodiff_accel _tensor_accel; do
            clang -bundle -undefined dynamic_lookup -mmacosx-version-min=11.0 -O3 $SIMD -fPIC \
              -I"$PYINC" "xue-native/$s.c" -o "$XUEDIR/$s$PYEXT"
            echo "built $s$PYEXT"
          done

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build C extensions (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set FTDEF=
          if "%PYFT%"=="1" set FTDEF=/DPy_GIL_DISABLED=1
          for %%s in (_units_accel _autodiff_accel _tensor_accel) do (
            cl /nologo /LD /O2 %FTDEF% /I"%PYINC%" xue-native\%%s.c /Fo"%RUNNER_TEMP%\\" /Fe"%XUEDIR%\%%s%PYEXT%" /link /LIBPATH:"%PKG%\libs" "%PYLIB%.lib" /IMPLIB:"%RUNNER_TEMP%\%%s.lib" || exit /b 1
          )
          dir "%XUEDIR%"

      # ---- Package and test the archive --------------------------------------
      - name: Package
        run: |
          set -euo pipefail
          "$PYEXE" -m compileall -q "$XUEDIR"
          if [ "$RUNNER_OS" = "Windows" ]; then
            ARCHIVE="$PKG.zip"; 7z a -tzip -bd "$ARCHIVE" "$PKG" >/dev/null
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            ARCHIVE="$PKG.tar.gz"; tar -czf "$ARCHIVE" "$PKG"
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Smoke-test package
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/smoke"; rm -rf "$T"; mkdir -p "$T"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z x -bd "-o$T" "$ARCHIVE" >/dev/null; PY="$T/$PKG/python.exe"
          else
            tar -xzf "$ARCHIVE" -C "$T"; PY="$T/$PKG/bin/python3"
          fi
          cd "$T"
          "$PY" -I -c "
          import sys, sysconfig
          import xue, xue.units, xue.tensor, xue.autodiff
          accel = sorted(m for m in sys.modules if m.endswith('_accel'))
          print(sys.version)
          print('prefix:', sys.prefix)
          print('accelerators:', accel)
          print('start-up hook:', 'xue.sitecustomize_xue' in sys.modules)
          print('GIL enabled:', getattr(sys, '_is_gil_enabled', lambda: True)())
          assert len(accel) == 3, accel
          assert 'xue.sitecustomize_xue' in sys.modules
          assert sys.prefix.replace('\\\\', '/').rstrip('/').endswith('$PKG')
          "
          STDLIB=$("$PY" -I -c "import sysconfig; print(sysconfig.get_path('stdlib'))")
          "$PY" -I -m unittest discover -s "$STDLIB/xue/tests" -t "$STDLIB"

      # ---- Artifacts (always) and GitHub Release (tags / publish=true) -------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          retention-days: 14

      - name: Upload to GitHub Release
        if: github.event_name == 'push' || github.event.inputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          generate_release_notes: true
